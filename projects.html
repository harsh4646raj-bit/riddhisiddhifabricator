<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects Portfolio — Riddhi Siddhi Fabricator</title>
<meta name="description" content="Explore our fabrication projects in Aluminium, uPVC, and Steel. Precision engineering for modern homes and commercial spaces in Muzaffarpur, Bihar.">
<link rel="icon" type="image/jpeg" href="Logo.jpeg">
<meta property="og:type" content="website">
<meta property="og:title" content="Fabrication Projects Portfolio — Riddhi Siddhi Fabricator">
<meta property="og:description" content="Explore our completed projects across Aluminium, uPVC, and Steel fabrication.">
<meta property="og:image" content="Logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #0E0709;
    --plum:         #53313B;
    --plum-light:   #6B4350;
    --plum-glow:    #7A4F5E;
    --taupe:        #B9A8AC;
    --blush:        #FCEEEF;
    --text:         #F5F0E8;
    --text-dim:     rgba(245, 240, 232, 0.6);
    --text-muted:   rgba(245, 240, 232, 0.35);
    --glass-bg:     rgba(18, 10, 13, 0.65);
    --glass-border: rgba(185, 168, 172, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ═══════════════════════════════════════════════════
     ARCHITECTURAL AMBIENT VIDEO BACKGROUND (z-index 0)
     ═══════════════════════════════════════════════════ */
  .page-bg-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: var(--bg);
  }
  .page-bg-video {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    filter: brightness(0.6) saturate(1.05);
    transform: scale(1.04);
    will-change: transform;
  }
  .page-bg-overlay {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 85% 85% at 50% 35%, rgba(14, 7, 9, 0.45) 0%, rgba(14, 7, 9, 0.85) 100%),
      linear-gradient(180deg, rgba(14, 7, 9, 0.65) 0%, rgba(14, 7, 9, 0.3) 40%, rgba(14, 7, 9, 0.75) 100%);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  @media (prefers-reduced-motion: reduce) {
    .page-bg-video { display: none; }
    .page-bg-container {
      background-image: url('assets/projects_bg.webp');
      background-size: cover;
      background-position: center;
    }
  }

  /* Navigation */
  #mainnav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 5vw;
    background: rgba(14, 7, 9, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(185, 168, 172, 0.08);
  }
  .nav-logo {
    display: flex; align-items: center; gap: 10px; text-decoration: none;
  }
  .nav-logo img { height: 32px; width: auto; filter: brightness(1.3); }
  .nav-logo span {
    font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--taupe); font-weight: 500;
  }
  .nav-links { display: flex; align-items: center; gap: 2.2vw; }
  .nav-links a {
    color: var(--text-dim); text-decoration: none;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    transition: color 0.3s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--text); }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-phone {
    color: var(--taupe); text-decoration: none; font-size: 12px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .nav-cta-btn {
    padding: 9px 22px; border-radius: 100px;
    background: var(--plum); color: var(--blush);
    text-decoration: none; font-size: 11px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    transition: all 0.3s;
  }
  .nav-cta-btn:hover {
    background: var(--plum-light);
    box-shadow: 0 8px 28px rgba(83, 49, 59, 0.35);
  }

  /* Main Container */
  main {
    position: relative; z-index: 10;
    flex: 1;
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 130px 5vw 80px;
  }

  /* Category Header */
  .page-header {
    text-align: center;
    margin-bottom: 44px;
  }
  .kicker {
    font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--taupe); margin-bottom: 12px; font-weight: 500;
  }
  h1 {
    font-size: clamp(34px, 5.5vw, 64px);
    font-weight: 700; letter-spacing: -0.025em; line-height: 1.1;
    margin-bottom: 14px;
    text-transform: capitalize;
  }
  .subtitle {
    font-size: clamp(14px, 1.2vw, 17px);
    color: var(--text-dim);
    max-width: 54ch;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* Category Filter Pills */
  .category-tabs {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 32px 0 48px;
    flex-wrap: wrap;
  }
  .cat-tab {
    padding: 10px 24px;
    border-radius: 100px;
    background: rgba(18, 10, 13, 0.6);
    border: 1px solid var(--glass-border);
    color: var(--taupe);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
    transition: all 0.3s;
    backdrop-filter: blur(12px);
  }
  .cat-tab:hover {
    background: rgba(83, 49, 59, 0.4);
    color: var(--text);
    border-color: rgba(185, 168, 172, 0.3);
  }
  .cat-tab.active {
    background: var(--plum);
    color: var(--blush);
    border-color: var(--plum-glow);
    box-shadow: 0 6px 24px rgba(83, 49, 59, 0.4);
  }

  /* Projects Grid */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 32px;
  }

  /* Project Card */
  .project-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    transition: all 0.4s cubic-bezier(.25,.8,.25,1);
    position: relative;
  }
  .project-card:hover {
    transform: translateY(-8px);
    border-color: rgba(185, 168, 172, 0.3);
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
    background: rgba(24, 14, 18, 0.8);
  }

  .card-image-wrap {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #180F12;
    overflow: hidden;
    position: relative;
  }
  .card-image {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(.25,.8,.25,1);
  }
  .project-card:hover .card-image {
    transform: scale(1.05);
  }
  .card-image-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1C1014, #2A171D);
    color: var(--taupe);
  }

  .card-body {
    padding: 26px 24px 28px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .card-meta-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-category {
    font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--taupe); font-weight: 600;
    padding: 4px 12px; border-radius: 100px;
    background: rgba(83, 49, 59, 0.35);
    border: 1px solid rgba(185, 168, 172, 0.15);
  }
  .card-location {
    font-size: 11px; color: var(--text-muted);
    display: flex; align-items: center; gap: 4px;
  }
  .card-title {
    font-size: 20px; font-weight: 600;
    letter-spacing: -0.015em; line-height: 1.25;
    margin-bottom: 10px;
    color: var(--text);
  }
  .card-desc {
    font-size: 13px; color: var(--text-dim); line-height: 1.6;
    margin-bottom: 22px; flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid rgba(185, 168, 172, 0.08);
  }
  .card-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--blush);
    transition: gap 0.3s;
  }
  .project-card:hover .card-btn { gap: 10px; color: var(--taupe); }
  .card-year {
    font-size: 11px; color: var(--text-muted);
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    max-width: 580px;
    margin: 40px auto;
  }
  .empty-state svg {
    width: 48px; height: 48px; stroke: var(--taupe); margin-bottom: 20px;
    opacity: 0.7;
  }
  .empty-state h3 {
    font-size: 22px; font-weight: 600; margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 14px; color: var(--text-dim); line-height: 1.6;
  }

  /* Loading Skeleton */
  .skeleton-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    height: 380px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }

  /* Footer */
  .site-footer {
    position: relative; z-index: 10;
    border-top: 1px solid rgba(245, 240, 232, 0.05);
    padding: 60px 5vw 40px;
    background: rgba(14, 7, 9, 0.85);
    margin-top: auto;
  }
  .footer-inner {
    max-width: 1240px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 20px;
  }
  .footer-brand {
    display: flex; align-items: center; gap: 10px; font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--taupe);
  }
  .footer-brand img { height: 28px; }
  .footer-copy {
    font-size: 11px; color: var(--text-muted);
  }

  @media (max-width: 768px) {
    .projects-grid { grid-template-columns: 1fr; }
    .nav-links { display: none; }
    .nav-phone span { display: none; }
  }
</style>
</head>
<body>

<!-- ═════════════════════════════════════════════
     ARCHITECTURAL AMBIENT BACKGROUND
     ═════════════════════════════════════════════ -->
<div class="page-bg-container">
  <video class="page-bg-video" autoplay muted loop playsinline poster="assets/projects_bg.webp">
    <source src="assets/projects_bg.mp4" type="video/mp4">
  </video>
  <div class="page-bg-overlay"></div>
</div>

<!-- Navigation -->
<nav id="mainnav">
  <a class="nav-logo" href="index.html">
    <img src="Logo.jpeg" alt="Riddhi Siddhi">
    <span>Riddhi Siddhi</span>
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="projects.html?category=aluminium">Aluminium</a>
    <a href="projects.html?category=upvc">uPVC</a>
    <a href="projects.html?category=steel">Steel</a>
    <a href="index.html#contact">Contact</a>
  </div>
  <div class="nav-right">
    <a class="nav-phone" href="tel:9771086644">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span>9771086644</span>
    </a>
    <a class="nav-cta-btn" href="quote.html">Get Quote</a>
  </div>
</nav>

<!-- Main Projects Content -->
<main>
  <div class="page-header">
    <p class="kicker">Fabrication Portfolio</p>
    <h1 id="category-title">Projects</h1>
    <p class="subtitle" id="category-desc">Explore our precision fabrication work crafted for modern architectural spaces.</p>
  </div>

  <!-- Category Switcher -->
  <div class="category-tabs">
    <a class="cat-tab" id="tab-aluminium" href="projects.html?category=aluminium">Aluminium</a>
    <a class="cat-tab" id="tab-upvc" href="projects.html?category=upvc">uPVC</a>
    <a class="cat-tab" id="tab-steel" href="projects.html?category=steel">Steel</a>
  </div>

  <!-- Grid or Empty State Container -->
  <div id="projects-container">
    <!-- Skeleton loader -->
    <div class="projects-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="Logo.jpeg" alt="Riddhi Siddhi">
      <span>Riddhi Siddhi Fabricator</span>
    </div>
    <div class="footer-copy">
      &copy; 2026 Riddhi Siddhi Fabricator. Muzaffarpur, Bihar. &bull; <a href="admin.html" style="color: inherit; text-decoration: none; opacity: 0.5;">Admin</a>
    </div>
  </div>
</footer>

<script src="js/backend-config.js"></script>
<script src="js/db.js"></script>
<script>
  // Parse active category from URL
  const urlParams = new URLSearchParams(window.location.search);
  let activeCategory = (urlParams.get("category") || "aluminium").toLowerCase().trim();
  if (!["aluminium", "upvc", "steel"].includes(activeCategory)) {
    activeCategory = "aluminium";
  }

  // Update Category Header & Title
  const categoryTitles = {
    aluminium: "Aluminium",
    upvc: "uPVC",
    steel: "Steel"
  };
  const categoryDescriptions = {
    aluminium: "Explore our aluminium fabrication projects — lightweight, corrosion-resistant frames engineered to last.",
    upvc: "Modern uPVC windows and doors built for superior thermal insulation, sound dampening, and comfort.",
    steel: "Strong architectural steel fabrication — custom gates, structural railings, and protective elements."
  };

  document.title = `${categoryTitles[activeCategory]} Projects — Riddhi Siddhi Fabricator`;
  document.getElementById("category-title").textContent = categoryTitles[activeCategory] + " Projects";
  document.getElementById("category-desc").textContent = categoryDescriptions[activeCategory];

  // Set active tab
  document.querySelectorAll(".cat-tab").forEach(tab => {
    if (tab.id === `tab-${activeCategory}`) {
      tab.classList.add("active");
    } else {
      tab.classList.remove("active");
    }
  });

  // Load Projects from DB
  async function loadProjects() {
    const container = document.getElementById("projects-container");
    try {
      const projects = await RS_DB.getProjectsByCategory(activeCategory, true);
      
      if (!projects || projects.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
            <h3>Projects Coming Soon</h3>
            <p>We are currently curating and uploading photographs of our recent ${categoryTitles[activeCategory]} projects. Please check back shortly or reach out to us directly.</p>
          </div>
        `;
        return;
      }

      const gridHtml = `
        <div class="projects-grid">
          ${projects.map(p => {
            const coverSrc = p.coverImage?.thumbnail || p.coverImage?.url || p.coverImage || "";
            return `
              <a class="project-card" href="project.html?category=${encodeURIComponent(p.category)}&slug=${encodeURIComponent(p.slug)}">
                <div class="card-image-wrap">
                  ${coverSrc ? `
                    <img class="card-image" src="${coverSrc}" alt="${escapeHtml(p.name)}" loading="lazy">
                  ` : `
                    <div class="card-image-placeholder">
                      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                    </div>
                  `}
                </div>
                <div class="card-body">
                  <div class="card-meta-top">
                    <span class="card-category">${escapeHtml(p.category)}</span>
                    ${p.location ? `
                      <span class="card-location">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                        ${escapeHtml(p.location)}
                      </span>
                    ` : ""}
                  </div>
                  <h2 class="card-title">${escapeHtml(p.name)}</h2>
                  ${p.shortDescription ? `<p class="card-desc">${escapeHtml(p.shortDescription)}</p>` : ""}
                  <div class="card-footer">
                    <span class="card-btn">
                      View Project
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </span>
                    ${p.year ? `<span class="card-year">${escapeHtml(p.year)}</span>` : ""}
                  </div>
                </div>
              </a>
            `;
          }).join("")}
        </div>
      `;
      container.innerHTML = gridHtml;

    } catch (err) {
      console.error("Error loading projects:", err);
      container.innerHTML = `
        <div class="empty-state">
          <h3>Unable to load projects</h3>
          <p>Please check your connection or refresh the page.</p>
        </div>
      `;
    }
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  loadProjects();
</script>

</body>
</html>
