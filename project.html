<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Details — Riddhi Siddhi Fabricator</title>
<meta name="description" content="Explore this custom architectural fabrication project by Riddhi Siddhi Fabricator in Muzaffarpur, Bihar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #0E0709;
    --plum:         #53313B;
    --plum-light:   #6B4350;
    --plum-glow:    #7A4F5E;
    --taupe:        #B9A8AC;
    --blush:        #FCEEEF;
    --text:         #F5F0E8;
    --text-dim:     rgba(245, 240, 232, 0.6);
    --text-muted:   rgba(245, 240, 232, 0.35);
    --glass-bg:     rgba(18, 10, 13, 0.65);
    --glass-border: rgba(185, 168, 172, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ═══════════════════════════════════════════════════
     ARCHITECTURAL AMBIENT VIDEO BACKGROUND (z-index 0)
     ═══════════════════════════════════════════════════ */
  .page-bg-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: var(--bg);
  }
  .page-bg-video {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    filter: brightness(0.55) saturate(1.05);
    transform: scale(1.04);
    will-change: transform;
  }
  .page-bg-overlay {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 85% 85% at 50% 35%, rgba(14, 7, 9, 0.5) 0%, rgba(14, 7, 9, 0.9) 100%),
      linear-gradient(180deg, rgba(14, 7, 9, 0.7) 0%, rgba(14, 7, 9, 0.4) 40%, rgba(14, 7, 9, 0.8) 100%);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }
  @media (prefers-reduced-motion: reduce) {
    .page-bg-video { display: none; }
    .page-bg-container {
      background-image: url('assets/projects_bg.webp');
      background-size: cover;
      background-position: center;
    }
  }

  /* Navigation */
  #mainnav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 5vw;
    background: rgba(14, 7, 9, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(185, 168, 172, 0.08);
  }
  .nav-logo {
    display: flex; align-items: center; gap: 10px; text-decoration: none;
  }
  .nav-logo img { height: 32px; width: auto; filter: brightness(1.3); }
  .nav-logo span {
    font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--taupe); font-weight: 500;
  }
  .nav-links { display: flex; align-items: center; gap: 2.2vw; }
  .nav-links a {
    color: var(--text-dim); text-decoration: none;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    transition: color 0.3s;
  }
  .nav-links a:hover { color: var(--text); }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-phone {
    color: var(--taupe); text-decoration: none; font-size: 12px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .nav-cta-btn {
    padding: 9px 22px; border-radius: 100px;
    background: var(--plum); color: var(--blush);
    text-decoration: none; font-size: 11px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    transition: all 0.3s;
  }

  /* Main Container */
  main {
    position: relative; z-index: 10;
    flex: 1;
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 110px 5vw 80px;
  }

  /* Breadcrumb */
  .breadcrumb {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--taupe); margin-bottom: 24px;
  }
  .breadcrumb a {
    color: var(--text-dim); text-decoration: none;
    transition: color 0.2s;
  }
  .breadcrumb a:hover { color: var(--text); }
  .breadcrumb span.sep { color: var(--text-muted); }

  /* Hero Cover Image */
  .project-cover-container {
    width: 100%;
    border-radius: 28px;
    overflow: hidden;
    background: #140A0D;
    border: 1px solid var(--glass-border);
    margin-bottom: 48px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    aspect-ratio: 16 / 9;
    max-height: 640px;
    position: relative;
  }
  .project-cover-img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Project Layout: Info & Specs Grid */
  .project-main-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 48px;
    margin-bottom: 64px;
  }

  /* Info Column */
  .project-info-col {
    display: flex; flex-direction: column;
  }
  .project-category-badge {
    display: inline-block;
    font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--taupe); font-weight: 600;
    padding: 6px 16px; border-radius: 100px;
    background: rgba(83, 49, 59, 0.35);
    border: 1px solid rgba(185, 168, 172, 0.15);
    margin-bottom: 16px; width: fit-content;
  }
  h1.project-title {
    font-size: clamp(32px, 4.5vw, 56px);
    font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;
    margin-bottom: 24px;
  }
  .project-lead {
    font-size: clamp(15px, 1.2vw, 18px);
    color: var(--text); line-height: 1.7;
    margin-bottom: 20px; font-weight: 400;
  }
  .project-full-desc {
    font-size: 14px; color: var(--text-dim); line-height: 1.8;
    white-space: pre-line;
  }

  /* Specs Card Column */
  .specs-card {
    background: var(--glass-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 32px 28px;
    height: fit-content;
    display: flex; flex-direction: column; gap: 20px;
  }
  .specs-card h3 {
    font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--taupe); font-weight: 600;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(185, 168, 172, 0.1);
  }
  .spec-item {
    display: flex; flex-direction: column; gap: 4px;
  }
  .spec-label {
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 500;
  }
  .spec-value {
    font-size: 14px; color: var(--text); font-weight: 500;
  }

  /* Project Action Buttons */
  .project-actions {
    display: flex; flex-direction: column; gap: 12px; margin-top: 12px;
  }
  .btn-inquire {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 24px; border-radius: 100px;
    background: var(--plum); color: var(--blush);
    text-decoration: none; font-size: 12px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    transition: all 0.3s;
  }
  .btn-inquire:hover {
    background: var(--plum-light);
    box-shadow: 0 8px 24px rgba(83, 49, 59, 0.45);
    transform: translateY(-2px);
  }
  .btn-share {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 24px; border-radius: 100px;
    background: rgba(185, 168, 172, 0.06); color: var(--taupe);
    border: 1px solid var(--glass-border);
    cursor: pointer; font-size: 12px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    transition: all 0.3s; font-family: inherit;
  }
  .btn-share:hover {
    background: rgba(185, 168, 172, 0.15); color: var(--text);
  }

  /* Gallery Section */
  .gallery-section {
    margin-top: 40px;
  }
  .gallery-header {
    margin-bottom: 28px;
  }
  .gallery-header h2 {
    font-size: 26px; font-weight: 600; letter-spacing: -0.015em;
    margin-bottom: 6px;
  }
  .gallery-header p {
    font-size: 13px; color: var(--text-dim);
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .gallery-item {
    border-radius: 20px;
    overflow: hidden;
    background: #140A0D;
    border: 1px solid var(--glass-border);
    aspect-ratio: 4 / 3;
    cursor: pointer;
    position: relative;
  }
  .gallery-thumb {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.5s cubic-bezier(.25,.8,.25,1);
    display: block;
  }
  .gallery-item:hover .gallery-thumb {
    transform: scale(1.06);
  }
  .gallery-item-overlay {
    position: absolute; inset: 0;
    background: rgba(14, 7, 9, 0.4);
    opacity: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.3s ease;
  }
  .gallery-item:hover .gallery-item-overlay {
    opacity: 1;
  }
  .gallery-item-overlay svg {
    width: 32px; height: 32px; stroke: var(--blush);
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
  }

  /* Fullscreen Lightbox */
  #lightbox {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(10, 5, 7, 0.96);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
  }
  #lightbox.active {
    opacity: 1; pointer-events: all;
  }
  .lightbox-content {
    position: relative;
    max-width: 90vw;
    max-height: 85vh;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-img {
    max-width: 90vw; max-height: 85vh;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
  }
  .lightbox-close {
    position: absolute; top: 24px; right: 28px;
    background: rgba(18, 10, 13, 0.7);
    border: 1px solid var(--glass-border);
    color: var(--text); border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s;
  }
  .lightbox-close:hover {
    background: var(--plum); color: var(--blush);
  }
  .lightbox-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(18, 10, 13, 0.7);
    border: 1px solid var(--glass-border);
    color: var(--text); border-radius: 50%;
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s;
  }
  .lightbox-nav:hover {
    background: var(--plum); color: var(--blush);
  }
  .lightbox-prev { left: 28px; }
  .lightbox-next { right: 28px; }
  .lightbox-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: 13px; letter-spacing: 0.15em; color: var(--taupe);
    background: rgba(18, 10, 13, 0.7);
    padding: 6px 18px; border-radius: 100px;
    border: 1px solid var(--glass-border);
  }

  /* Empty / Not Found */
  .not-found {
    text-align: center; padding: 80px 20px;
  }
  .not-found h2 { font-size: 28px; margin-bottom: 12px; }
  .not-found p { font-size: 14px; color: var(--text-dim); margin-bottom: 24px; }

  /* Footer */
  .site-footer {
    position: relative; z-index: 10;
    border-top: 1px solid rgba(245, 240, 232, 0.05);
    padding: 60px 5vw 40px;
    background: rgba(14, 7, 9, 0.85);
    margin-top: auto;
  }
  .footer-inner {
    max-width: 1240px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 20px;
  }
  .footer-brand {
    display: flex; align-items: center; gap: 10px; font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--taupe);
  }
  .footer-brand img { height: 28px; }
  .footer-copy { font-size: 11px; color: var(--text-muted); }

  @media (max-width: 900px) {
    .project-main-grid { grid-template-columns: 1fr; gap: 36px; }
    .lightbox-nav { width: 42px; height: 42px; }
    .lightbox-prev { left: 12px; }
    .lightbox-next { right: 12px; }
    .nav-links { display: none; }
    .nav-phone span { display: none; }
  }
</style>
</head>
<body>

<!-- ═════════════════════════════════════════════
     ARCHITECTURAL AMBIENT BACKGROUND
     ═════════════════════════════════════════════ -->
<div class="page-bg-container">
  <video class="page-bg-video" autoplay muted loop playsinline poster="assets/projects_bg.webp">
    <source src="assets/projects_bg.mp4" type="video/mp4">
  </video>
  <div class="page-bg-overlay"></div>
</div>

<!-- Navigation -->
<nav id="mainnav">
  <a class="nav-logo" href="index.html">

      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

<!-- Main Container -->
<main id="project-container">
  <div style="text-align: center; padding: 60px 0;">
    <p style="color: var(--taupe); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase;">Loading project details...</p>
  </div>
</main>

<!-- Lightbox Modal -->
<div id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous">

</div>

      <img src="Logo.jpeg" alt="Riddhi Siddhi">

    <div class="footer-copy">
      &copy; 2026 Riddhi Siddhi Fabricator. Muzaffarpur, Bihar. &bull; <a href="admin.html" style="color: inherit; text-decoration: none; opacity: 0.5;">Admin</a>

  </div>
</footer>

<script src="js/seed-projects.js"></script>
<script src="js/backend-config.js"></script>
<script src="js/db.js"></script>
<script>
  let allGalleryImages = [];
  let currentImageIndex = 0;

  async function initProjectPage() {
    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get("category");
    const slug = urlParams.get("slug");
    const id = urlParams.get("id");

    const container = document.getElementById("project-container");

    let project = null;
    if (category && slug) {
      project = await RS_DB.getProjectBySlug(category, slug);
    } else if (id) {
      project = await RS_DB.getProjectById(id);
    }

    if (!project) {
      container.innerHTML = `
        <div class="not-found">
          <h2>Project Not Found</h2>
          <p>The project you are looking for does not exist or is currently unpublished.</p>
          <a class="btn-inquire" href="projects.html?category=${encodeURIComponent(category || 'aluminium')}">
            &larr; View ${category ? category.toUpperCase() : 'ALL'} Projects
          </a>
        </div>
      `;
      return;
    }

    // Document Title
    document.title = `${project.name} (${project.category.toUpperCase()}) — Riddhi Siddhi Fabricator`;

    // Collect all images (Cover + Gallery)
    allGalleryImages = [];
    const coverUrl = project.coverImage?.url || project.coverImage || "";
    if (coverUrl) {
      allGalleryImages.push({ url: coverUrl, caption: project.name + " Cover" });
    }
    if (Array.isArray(project.galleryImages)) {
      project.galleryImages.forEach((img, idx) => {
        const url = img?.url || img || "";
        if (url && url !== coverUrl) {
          allGalleryImages.push({ url, caption: img?.caption || `${project.name} Photo ${idx + 1}` });
        }
      });
    }

    // WhatsApp Message URL
    const waText = encodeURIComponent(
      `Hi Riddhi Siddhi Fabricator, I am inquiring about your ${project.category.toUpperCase()} project: "${project.name}" (${window.location.href}). Could you provide more details and pricing?`
    );
    const waUrl = `https://wa.me/919771086644?text=${waText}`;

    // Render HTML
    container.innerHTML = `
      <!-- Breadcrumb -->
      <div class="breadcrumb">
        <a href="index.html">Home</a>
        <span class="sep">&rsaquo;</span>
        <a href="projects.html?category=${encodeURIComponent(project.category)}">${escapeHtml(project.category)}</a>
        <span class="sep">&rsaquo;</span>
        <span style="color: var(--text);">${escapeHtml(project.name)}</span>
      </div>

      <!-- Hero Cover Image -->
      ${coverUrl ? `
        <div class="project-cover-container" onclick="openLightbox(0)" style="cursor: pointer;">
          <img class="project-cover-img" src="${coverUrl}" alt="${escapeHtml(project.name)}">
        </div>
      ` : ""}

      <!-- Main Grid: Info + Specs -->
      <div class="project-main-grid">
        <div class="project-info-col">
          <span class="project-category-badge">${escapeHtml(project.category)}</span>
          <h1 class="project-title">${escapeHtml(project.name)}</h1>
          ${project.shortDescription ? `<p class="project-lead">${escapeHtml(project.shortDescription)}</p>` : ""}
          ${project.description ? `<div class="project-full-desc">${escapeHtml(project.description)}</div>` : ""}
        </div>

        <div class="specs-card">
          <h3>Project Specifications</h3>
          
          <div class="spec-item">
            <span class="spec-label">Material Category</span>
            <span class="spec-value" style="text-transform: capitalize;">${escapeHtml(project.category)}</span>
          </div>

          ${project.location ? `
            <div class="spec-item">
              <span class="spec-label">Location</span>
              <span class="spec-value">${escapeHtml(project.location)}</span>
            </div>
          ` : ""}

          ${project.services ? `
            <div class="spec-item">
              <span class="spec-label">Work / Services</span>
              <span class="spec-value">${escapeHtml(project.services)}</span>
            </div>
          ` : ""}

          ${project.year ? `
            <div class="spec-item">
              <span class="spec-label">Year</span>
              <span class="spec-value">${escapeHtml(project.year)}</span>
            </div>
          ` : ""}

          <div class="project-actions">
            <a class="btn-inquire" href="quote.html?material=${encodeURIComponent(project.category)}&project=${encodeURIComponent(project.name)}">
              Request a Similar Project
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </a>
            <a class="btn-share" href="${waUrl}" target="_blank" rel="noopener" style="text-decoration: none;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
              Inquire via WhatsApp
            </a>
            <button class="btn-share" onclick="shareProject('${escapeHtml(project.name)}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              Share Project
            </button>
          </div>
        </div>
      </div>

      <!-- Additional Gallery Section -->
      ${allGalleryImages.length > 1 ? `
        <div class="gallery-section">
          <div class="gallery-header">
            <h2>Project Photographs</h2>
            <p>Click any photograph to inspect in full resolution.</p>
          </div>
          <div class="gallery-grid">
            ${allGalleryImages.map((img, idx) => `
              <div class="gallery-item" onclick="openLightbox(${idx})">
                <img class="gallery-thumb" src="${img.url}" alt="${escapeHtml(img.caption)}" loading="lazy">
                <div class="gallery-item-overlay">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      ` : ""}
    `;
  }

  // ── Lightbox Logic ──
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const lightboxCounter = document.getElementById("lightbox-counter");

  function openLightbox(index) {
    if (!allGalleryImages || allGalleryImages.length === 0) return;
    currentImageIndex = index;
    updateLightbox();
    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
  }

  function updateLightbox() {
    if (currentImageIndex < 0) currentImageIndex = allGalleryImages.length - 1;
    if (currentImageIndex >= allGalleryImages.length) currentImageIndex = 0;
    const current = allGalleryImages[currentImageIndex];
    lightboxImg.src = current.url;
    lightboxCounter.textContent = `${currentImageIndex + 1} / ${allGalleryImages.length}`;
  }

  function nextLightbox() {
    currentImageIndex++;
    updateLightbox();
  }

  function prevLightbox() {
    currentImageIndex--;
    updateLightbox();
  }

  document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
  document.getElementById("lightbox-next").addEventListener("click", nextLightbox);
  document.getElementById("lightbox-prev").addEventListener("click", prevLightbox);

  // Close when clicking outside image
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox || e.target.classList.contains("lightbox-content")) {
      closeLightbox();
    }
  });

  // Keyboard navigation
  window.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("active")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") nextLightbox();
    if (e.key === "ArrowLeft") prevLightbox();
  });

  // Mobile Touch Swipe support
  let touchStartX = 0;
  lightbox.addEventListener("touchstart", (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });
  lightbox.addEventListener("touchend", (e) => {
    const touchEndX = e.changedTouches[0].screenX;
    if (touchStartX - touchEndX > 50) nextLightbox();
    if (touchEndX - touchStartX > 50) prevLightbox();
  }, { passive: true });

  // Share functionality
  async function shareProject(title) {
    if (navigator.share) {
      try {
        await navigator.share({
          title: title + " — Riddhi Siddhi Fabricator",
          url: window.location.href
        });
      } catch (err) {}
    } else {
      await navigator.clipboard.writeText(window.location.href);
      alert("Project link copied to clipboard!");
    }
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  initProjectPage();
</script>

</body>
</html>
